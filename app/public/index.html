<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Store Management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 18px 30px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      color: #d1d5db;
    }

    main {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 10px;
      color: #6b7280;
      font-size: 14px;
    }

    .card strong {
      font-size: 26px;
    }

    .section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section h2 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f9fafb;
    }

    .status {
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
    }

    .available {
      background: #dcfce7;
      color: #166534;
    }

    .low {
      background: #fef3c7;
      color: #92400e;
    }

    .out {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>POS Store Management System</h1>
  <p>Đề 21 - DTC245200029</p>
</header>

<main>

  <div class="cards">
    <div class="card">
      <h3>Sản phẩm</h3>
      <strong id="products">-</strong>
    </div>

    <div class="card">
      <h3>Danh mục</h3>
      <strong id="categories">-</strong>
    </div>

    <div class="card">
      <h3>Khách hàng</h3>
      <strong id="customers">-</strong>
    </div>

    <div class="card">
      <h3>Hóa đơn</h3>
      <strong id="invoices">-</strong>
    </div>

    <div class="card">
      <h3>Doanh thu</h3>
      <strong id="revenue">-</strong>
    </div>
  </div>

  <div class="section">
    <h2>Danh sách sản phẩm</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Sản phẩm</th>
          <th>Danh mục</th>
          <th>Giá</th>
          <th>Tồn kho</th>
        </tr>
      </thead>

      <tbody id="productTable">
        <tr>
          <td colspan="5">Đang tải...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="section">
    <h2>Hóa đơn gần đây</h2>

    <table>
      <thead>
        <tr>
          <th>Mã</th>
          <th>Khách hàng</th>
          <th>Thu ngân</th>
          <th>Tổng tiền</th>
          <th>Ngày tạo</th>
        </tr>
      </thead>

      <tbody id="invoiceTable">
        <tr>
          <td colspan="5">Đang tải...</td>
        </tr>
      </tbody>
    </table>
  </div>

</main>

<script>
  function formatMoney(value) {
    return Number(value).toLocaleString("vi-VN") + " đ";
  }

  function stockStatus(stock) {
    if (stock === 0) {
      return '<span class="status out">Hết hàng</span>';
    }

    if (stock <= 10) {
      return '<span class="status low">Sắp hết</span>';
    }

    return '<span class="status available">Còn hàng</span>';
  }

  async function loadDashboard() {
    const response = await fetch("/api/dashboard");
    const data = await response.json();

    document.getElementById("products").textContent = data.products;
    document.getElementById("categories").textContent = data.categories;
    document.getElementById("customers").textContent = data.customers;
    document.getElementById("invoices").textContent = data.invoices;
    document.getElementById("revenue").textContent = formatMoney(data.revenue);
  }

  async function loadProducts() {
    const response = await fetch("/api/products");
    const result = await response.json();

    const tbody = document.getElementById("productTable");

    tbody.innerHTML = result.data.map(product => `
      <tr>
        <td>${product.id}</td>
        <td>${product.name}</td>
        <td>${product.category_name || "-"}</td>
        <td>${formatMoney(product.price)}</td>
        <td>
          ${product.stock}
          ${stockStatus(product.stock)}
        </td>
      </tr>
    `).join("");
  }

  async function loadInvoices() {
    const response = await fetch("/api/invoices");
    const result = await response.json();

    const tbody = document.getElementById("invoiceTable");

    tbody.innerHTML = result.data.map(invoice => `
      <tr>
        <td>#${invoice.id}</td>
        <td>${invoice.customer_name || "Khách lẻ"}</td>
        <td>${invoice.cashier}</td>
        <td>${formatMoney(invoice.total)}</td>
        <td>${new Date(invoice.created_at).toLocaleString("vi-VN")}</td>
      </tr>
    `).join("");
  }

  async function loadAll() {
    try {
      await Promise.all([
        loadDashboard(),
        loadProducts(),
        loadInvoices()
      ]);
    } catch (error) {
      console.error(error);
      alert("Không thể tải dữ liệu từ server.");
    }
  }

  loadAll();
</script>

</body>
</html>
