services:

  mysql:
    image: mysql:8.4
    container_name: pos-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app

    container_name: pos-app
    restart: unless-stopped

    environment:
      APP_PORT: 3000
      DB_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - frontend
      - backend

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pos-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:80"

    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: pos-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app

    networks:
      - frontend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: pos-cadvisor
    restart: unless-stopped

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: pos-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - cadvisor

    networks:
      - frontend

  grafana:
    image: grafana/grafana:latest
    container_name: pos-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Admin@POS2026!Strong

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - frontend

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data: